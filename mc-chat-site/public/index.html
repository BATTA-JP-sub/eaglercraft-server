<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MC Chat</title>
<style>
  body { font-family: sans-serif; max-width: 640px; margin: 1rem auto; padding: 0 1rem; }
  .row { display: flex; gap: .5rem; margin: .5rem 0; }
  .row input, .row select { flex: 1; padding: .5rem; }
  button { padding: .5rem 1rem; }
  #log { height: 320px; overflow: auto; border: 1px solid #888; padding: .5rem;
         white-space: pre-wrap; font-family: monospace; font-size: 13px;
         background: #1e1e1e; color: #ddd; }
</style>
</head>
<body>
<h1>MC Chat</h1>

<div class="row">
  <input id="server" value="wss://mc.lampnetwork.net" placeholder="wss://... または mc.example.com:25565">
</div>
<div class="row">
  <input id="version" placeholder="バージョン（空欄で自動。例: 1.8.8）">
</div>
<div class="row">
  <input id="user" placeholder="Microsoftアカウント / ニックネーム">
  <select id="auth">
    <option value="microsoft">Microsoft認証</option>
    <option value="offline">オフラインモード</option>
  </select>
</div>
<div class="row">
  <button id="login">ログイン</button>
  <button id="logout">切断</button>
</div>

<div id="log"></div>

<div class="row">
  <input id="text" placeholder="メッセージ" maxlength="256">
  <button id="send">送信</button>
</div>

<script>
// 同じサーバーから配信する場合は空のままでOK。
// GitHub Pagesなど別ドメインに置く場合は 'wss://your-app.onrender.com' を指定
const BACKEND_URL = ''

const url = BACKEND_URL || `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}`
const ws = new WebSocket(url)
const $ = (id) => document.getElementById(id)
const log = $('log')

// ===== Minecraftの色コード(§)をHTMLに変換する =====
const MC_COLORS = {
  '0': '#000000', '1': '#0000AA', '2': '#00AA00', '3': '#00AAAA',
  '4': '#AA0000', '5': '#AA00AA', '6': '#FFAA00', '7': '#AAAAAA',
  '8': '#555555', '9': '#5555FF', 'a': '#55FF55', 'b': '#55FFFF',
  'c': '#FF5555', 'd': '#FF55FF', 'e': '#FFFF55', 'f': '#FFFFFF',
}

const mcToHtml = (text) => {
  const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  let html = ''
  let span = false
  let color = null
  let bold = false
  let italic = false
  let strike = false
  let underline = false

  const openSpan = () => {
    if (span) html += '</span>'
    const styles = [`color:${color || 'inherit'}`]
    if (bold) styles.push('font-weight:bold')
    if (italic) styles.push('font-style:italic')
    const deco = []
    if (strike) deco.push('line-through')
    if (underline) deco.push('underline')
    if (deco.length) styles.push(`text-decoration:${deco.join(' ')}`)
    html += `<span style="${styles.join(';')}">`
    span = true
  }

  openSpan()
  const parts = text.split('§')
  for (let i = 0; i < parts.length; i++) {
    if (i === 0) {
      html += esc(parts[i])
      continue
    }
    const code = parts[i][0]?.toLowerCase()
    const rest = parts[i].slice(1)
    if (MC_COLORS[code]) {
      color = MC_COLORS[code]
      bold = italic = strike = underline = false
      openSpan()
    } else if (code === 'l') { bold = true; openSpan() }
    else if (code === 'o') { italic = true; openSpan() }
    else if (code === 'm') { strike = true; openSpan() }
    else if (code === 'n') { underline = true; openSpan() }
    else if (code === 'r') { color = null; bold = italic = strike = underline = false; openSpan() }
    html += esc(rest)
  }
  if (span) html += '</span>'
  return html
}

const TYPE_LABEL = { chat: 'chat', status: 'status', error: 'error', auth: 'auth', sent: '送信' }

const addLog = (type, text) => {
  // サーバーから来たメッセージ（チャットと、キック理由）はMinecraft風の色付きで表示
  const useColor = type === 'chat' || (type === 'error' && /^kicked:/.test(text))
  const label = TYPE_LABEL[type] || type
  const line = document.createElement('div')
  if (type === 'sent') line.style.color = '#8fd1ff'
  if (useColor) {
    let display = text
    const m = text.match(/^kicked:\s*(\{.*\})$/s)
    if (m) {
      try {
        const obj = JSON.parse(m[1])
        display = (obj.text || '') + (obj.extra ? obj.extra.map((e) => e.text || '').join('') : '')
      } catch {}
    }
    line.innerHTML = `[${label}] ` + mcToHtml(display)
  } else {
    line.textContent = `[${label}] ${text}`
  }
  log.appendChild(line)
  log.scrollTop = log.scrollHeight
}
// ===============================================

ws.onopen = () => addLog('status', 'サーバーに接続しました')
ws.onclose = () => addLog('status', 'サーバーとの接続が切れました')
ws.onmessage = (e) => {
  const { type, text } = JSON.parse(e.data)
  addLog(type, text)
}

// 前回入力したサーバーを復元（保存できない環境では無視）
try {
  const saved = localStorage.getItem('mc-server')
  if (saved) $('server').value = saved
} catch {}

$('login').onclick = () => {
  try { localStorage.setItem('mc-server', $('server').value) } catch {}
  ws.send(JSON.stringify({
    type: 'login',
    server: $('server').value,
    version: $('version').value,
    username: $('user').value,
    auth: $('auth').value,
  }))
}
$('logout').onclick = () => ws.send(JSON.stringify({ type: 'logout' }))

const sendChat = () => {
  const text = $('text').value
  if (!text.trim()) return
  ws.send(JSON.stringify({ type: 'chat', text }))
  $('text').value = ''
}
$('send').onclick = sendChat
$('text').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendChat()
})
</script>
</body>
</html>
